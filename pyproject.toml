[project]
name = "multi-agent-dev-team"
version = "1.0.0"
description = "多Agent AI开发团队系统 — 需求分析、开发、测试、文档自动化"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
